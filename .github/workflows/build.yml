name: build

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2jxl_selftest.exe

      - name: Deploy Qt runtime
        run: |
          N=img2jxl-${{ github.ref_name }}-windows-x64
          mkdir -p pkg/$N
          cp build/img2jxl.exe build/img2jxl-gui.exe pkg/$N/
          WDEP=$(command -v windeployqt || command -v windeployqt6)
          "$WDEP" --release --no-translations \
            --no-system-d3d-compiler --no-opengl-sw "pkg/$N/img2jxl-gui.exe"
          rm -rf pkg/$N/tls pkg/$N/networkinformation \
                 pkg/$N/generic pkg/$N/Qt6Network.dll

      # zip here rather than in the release job: the archive is then just
      # another artifact file, like the tarballs the other jobs upload
      - name: Package (zip)
        shell: pwsh
        run: |
          $n = "img2jxl-${{ github.ref_name }}-windows-x64"
          Compress-Archive -Path "pkg/$n" -DestinationPath "$n.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: img2jxl-${{ github.ref_name }}-windows-x64
          path: img2jxl-${{ github.ref_name }}-windows-x64.zip

  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2jxl_selftest

      - name: Package (CLI + GUI with bundled Qt libs)
        run: |
          V=${{ github.ref_name }}
          D=img2jxl-$V-linux-x64
          mkdir -p $D/lib $D/plugins/platforms $D/plugins/imageformats
          cp build/img2jxl $D/
          cp build/img2jxl-gui $D/
          # bundle the Qt shared libraries the GUI links against
          for lib in $(ldd build/img2jxl-gui | grep -oE '/[^ ]*libQt6[^ ]*\.so[^ ]*'); do
            cp "$lib" $D/lib/
          done
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqxcb.so $D/plugins/platforms/ 2>/dev/null || true
          for p in /usr/lib/x86_64-linux-gnu/qt6/plugins/imageformats/*.so; do
            [ -e "$p" ] && cp "$p" $D/plugins/imageformats/
          done
          cat > $D/img2jxl-gui.sh << 'EOS'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/img2jxl-gui" "$@"
          EOS
          chmod +x $D/img2jxl-gui.sh $D/img2jxl $D/img2jxl-gui
          tar -czf $D.tar.gz $D

          # ---- Debian package: the same files, installed under /opt/img2jxl ----
          VER="${V#v}"
          case "$VER" in
            [0-9]*) ;;
            *) VER=0.0.0 ;;
          esac
          P=img2jxl_${VER}_amd64
          rm -rf $P
          mkdir -p $P/DEBIAN $P/opt/img2jxl $P/usr/bin $P/usr/share/applications
          cp -a $D/. $P/opt/img2jxl/
          cat > $P/usr/bin/img2jxl << 'EOS'
          #!/bin/sh
          exec /opt/img2jxl/img2jxl "$@"
          EOS
          cat > $P/usr/bin/img2jxl-gui << 'EOS'
          #!/bin/sh
          export LD_LIBRARY_PATH="/opt/img2jxl/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/img2jxl/plugins"
          exec /opt/img2jxl/img2jxl-gui "$@"
          EOS
          cat > $P/usr/share/applications/img2jxl.desktop << 'EOS'
          [Desktop Entry]
          Type=Application
          Name=img2jxl
          Comment=Convert BMP/TGA/PNM/ICO/JPEG/PNG/GIF/QOI/WebP/TIFF/JXL images to JPEG XL
          Exec=img2jxl-gui
          Terminal=false
          Categories=Graphics;Utility;
          EOS
          cat > $P/DEBIAN/control << EOS
          Package: img2jxl
          Version: $VER
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Hanson418 <https://github.com/Hanson418>
          Depends: libc6, libstdc++6, libgl1, libxkbcommon0, libfontconfig1, libfreetype6, libdbus-1-3, libx11-6, libxcb1, libglib2.0-0
          Installed-Size: $(du -sk $P/opt | cut -f1)
          Description: lossless multi-format image to JPEG XL converter
           Converts BMP, TGA, PNM, ICO, JPEG, PNG, GIF, QOI, WebP, TIFF and JXL
           images to JPEG XL, with a CLI and a Qt GUI. Bit depth and metadata
           (EXIF, ICC, XMP, resolution) are preserved. Qt is bundled.
          EOS
          chmod 0755 $P/usr/bin/img2jxl $P/usr/bin/img2jxl-gui
          dpkg-deb --root-owner-group --build $P
          rm -rf $P

      - uses: actions/upload-artifact@v4
        with:
          name: img2jxl-${{ github.ref_name }}-linux-x64
          path: |
            img2jxl-${{ github.ref_name }}-linux-x64.tar.gz
            img2jxl_*_amd64.deb

  # ------------------------------------------------------------------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install cmake ninja qt

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2jxl_selftest

      - name: Package (CLI + GUI app bundle)
        run: |
          V=${{ github.ref_name }}
          D=img2jxl-$V-macos
          mkdir -p $D
          cp build/img2jxl $D/
          # the GUI is built as an .app bundle on macOS; deploy Qt into it
          ls build/*.app && macdeployqt build/*.app -no-strip
          cp -R build/*.app $D/
          tar -czf $D.tar.gz $D

          # ---- disk image with the usual drag-to-Applications layout ----
          # unsigned, so the first launch needs right-click > Open
          STAGE=$D-dmg
          rm -rf $STAGE
          mkdir -p $STAGE
          # ditto (not cp) keeps the .app bundle's symlinks and attributes intact
          ditto "$D" "$STAGE"
          ln -s /Applications $STAGE/Applications
          hdiutil create -volname "img2jxl $V" -srcfolder "$STAGE" \
            -ov -format UDZO "$D.dmg"
          rm -rf $STAGE

      - uses: actions/upload-artifact@v4
        with:
          name: img2jxl-${{ github.ref_name }}-macos
          path: |
            img2jxl-${{ github.ref_name }}-macos.tar.gz
            img2jxl-${{ github.ref_name }}-macos.dmg

  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # The release body is left to the maintainer: release notes are written
      # locally (RELEASE_NOTES_<tag>.md) and pasted in by hand.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
